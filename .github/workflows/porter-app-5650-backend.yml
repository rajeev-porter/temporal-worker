"on":
    push:
        branches:
            - main
name: Deploy to backend
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: backend
                PORTER_CLUSTER: "5650"
                PORTER_DEPLOYMENT_TARGET_ID: e8d80e6b-2a2b-4978-97f8-8944f94c7866
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "9267"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_9267_16154 }}
